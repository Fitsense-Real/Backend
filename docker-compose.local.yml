# PostgreSQL 16 solo para desarrollo local (perfil «local»). Credenciales de
# desarrollo; los datos viven en el volumen fitsense-local-data.
#   docker compose -f docker-compose.local.yml up -d
#   docker compose -f docker-compose.local.yml down          # parar
#   docker compose -f docker-compose.local.yml down -v       # parar y BORRAR los datos locales
services:
  postgres:
    image: postgres:16-alpine
    container_name: fitsense-local-db
    environment:
      POSTGRES_DB: fitsense
      POSTGRES_USER: fitsense
      POSTGRES_PASSWORD: fitsense-local-solo-desarrollo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fitsense-local-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitsense -d fitsense"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  fitsense-local-data:
