# Verificacion minima de cada PR: compilacion, unitarias e integracion sobre
# PostgreSQL efimero (Testcontainers, con el Docker del runner).
#
# No toca Neon ni Replicate: no hay secretos en este workflow. Las pruebas que
# los necesitan son opt-in (Replicate real, Neon, replica P2-D de pruebas) y se
# omiten solas sin sus propiedades. La guardia BaseDeProduccionBloqueada del
# perfil integration impide cualquier conexion a la base de produccion.
name: CI

on:
  pull_request:
  push:
    branches: [main, generation]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilacion, unitarias e integracion
        run: mvn -B -ntp verify -Pintegration

      - name: Informes de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes-de-pruebas
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7
