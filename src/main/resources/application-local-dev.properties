# =====================================================================
# Perfil LOCAL-DEV (cierre definitivo del backend, fase 3.1). Se activa con
#   SPRING_PROFILES_ACTIVE=local-dev
# (application-local.properties sigue reservado, e ignorado por git, para la
# configuracion personal de cada desarrollador; LocalProfileGuard protege los dos.)
# Solo para desarrollo y pruebas en tu maquina: PostgreSQL local (docker compose
# -f docker-compose.local.yml up -d), IA apagada, sin tokens de Replicate.
#
# NO modifica la configuracion de produccion (application.properties). Con este
# perfil activo, LocalProfileGuard IMPIDE arrancar si la base no es local
# (Neon, Railway o cualquier host remoto), aunque se pase por variable.
# =====================================================================

spring.datasource.url=${LOCAL_DB_URL:jdbc:postgresql://localhost:5432/fitsense}
spring.datasource.username=${LOCAL_DB_USER:fitsense}
spring.datasource.password=${LOCAL_DB_PASSWORD:fitsense-local-solo-desarrollo}

# Clave JWT SOLO de desarrollo (>= 32 bytes). Nunca usar este valor fuera de local.
authorization.jwt.secret=${JWT_SECRET:clave-local-solo-desarrollo-0123456789abcdef0123}

# IA apagada y sin token: el motor de reglas genera y el respaldo adapta.
fitsense.ai.enabled=false
fitsense.ai.api-token=

# Utilidades de desarrollo: ciclo manual (POST /api/v1/cycle/run-for-me) y Swagger.
fitsense.cycle.manual-run.enabled=${FITSENSE_MANUAL_CYCLE_ENABLED:true}
fitsense.api-docs.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Recuperacion de contrasena (si esta incluida): el codigo se escribe en el log
# local para poder probar el flujo; en cualquier otro entorno el valor es none.
fitsense.password-reset.delivery=${FITSENSE_PASSWORD_RESET_DELIVERY:dev-log}
