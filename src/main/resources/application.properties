spring.application.name=Fitsense

spring.datasource.url=jdbc:postgresql://ep-dark-brook-b4emftmn-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.placeholder-replacement=false

authorization.jwt.secret=${JWT_SECRET}
authorization.jwt.expiration.days=7
# --- Recuperacion de contrasena (cierre definitivo, 2.2) ----------------------
# Sin proveedor de correo autorizado: none no envia nada (flujo NO operativo para
# usuarios reales). dev-log escribe el codigo en el log: SOLO desarrollo local.
fitsense.password-reset.delivery=${FITSENSE_PASSWORD_RESET_DELIVERY:none}
fitsense.password-reset.ttl-minutes=${FITSENSE_PASSWORD_RESET_TTL_MINUTES:30}
fitsense.password-reset.max-requests-per-hour=${FITSENSE_PASSWORD_RESET_MAX_PER_HOUR:3}
# Enlace del correo de recuperacion (https, con {token}). Vacio: el correo lleva solo el codigo. Ver
# docs/FitSense/preparacion_google_play_backend/RECUPERACION_CONTRASENA.md.
fitsense.password-reset.link-template=${FITSENSE_PASSWORD_RESET_LINK_TEMPLATE:}
# Correo transaccional: none (por omision) | smtp | resend | brevo. La clave solo por variable de entorno.
fitsense.mail.transport=${FITSENSE_MAIL_TRANSPORT:none}
fitsense.mail.from=${FITSENSE_MAIL_FROM:}
fitsense.mail.from-name=${FITSENSE_MAIL_FROM_NAME:Kora}
fitsense.mail.api-key=${FITSENSE_MAIL_API_KEY:}
fitsense.mail.api-base-url=${FITSENSE_MAIL_API_BASE_URL:}
# SMTP con tiempos maximos (JavaMail no tiene por omision): un servidor que no responde no bloquea el envio.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Solicitud web de eliminacion de cuenta (backend de la pagina publica; necesita un transporte de correo).
fitsense.account-deletion.web.ttl-minutes=${FITSENSE_ACCOUNT_DELETION_WEB_TTL_MINUTES:30}
fitsense.account-deletion.web.max-requests-per-hour=3
fitsense.account-deletion.web.link-template=${FITSENSE_ACCOUNT_DELETION_WEB_LINK_TEMPLATE:}
# Edad minima (no menor que 18) y consentimientos versionados (V63). Sin version = sin documento aprobado:
# no se puede aceptar. enforce-on-signup=true exige ambas en el registro; NO activar sin documentos aprobados.
fitsense.profile.minimum-age=18
fitsense.consent.terms-version=${FITSENSE_CONSENT_TERMS_VERSION:}
fitsense.consent.privacy-version=${FITSENSE_CONSENT_PRIVACY_VERSION:}
fitsense.consent.enforce-on-signup=${FITSENSE_CONSENT_ENFORCE_ON_SIGNUP:false}
# Limite por IP de los endpoints publicos (por accion y ventana).
fitsense.public-rate-limit.max-per-window=${FITSENSE_PUBLIC_RATE_LIMIT:20}
fitsense.public-rate-limit.window-minutes=15

# --- Seguridad por entorno (docs/FitSense/SEGURIDAD_Y_ROLES.md) -------------
# Origenes exactos del navegador, separados por comas (Angular en Vercel; en
# desarrollo http://localhost:4200). Vacio no autoriza ninguno; se rechaza el
# comodin. Flutter no lo necesita: no es un navegador.
fitsense.cors.allowed-origins=${FITSENSE_CORS_ORIGINS:}
# Swagger y /v3/api-docs: apagados salvo que se pidan (solo desarrollo).
fitsense.api-docs.enabled=${FITSENSE_API_DOCS_ENABLED:false}
springdoc.api-docs.enabled=${FITSENSE_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${FITSENSE_API_DOCS_ENABLED:false}
# POST /api/v1/cycle/run-for-me: apagado. El ciclo lo corre WeeklyCycleScheduler;
# encenderlo solo en desarrollo o pruebas.
fitsense.cycle.manual-run.enabled=${FITSENSE_MANUAL_CYCLE_ENABLED:false}

# Configuracion evaluada con Replicate real (docs/FitSense/consolidacion_ia/): IA encendida por defecto para
# generar (PR-1.7) y adaptar (V2.1). FITSENSE_AI_ENABLED=false es el interruptor de emergencia. Sin token
# (REPLICATE_API_TOKEN) la IA no es utilizable y el motor de reglas genera; los reintentos, el cortacircuitos
# y el respaldo determinista no cambian. Las pruebas la apagan siempre (surefire y failsafe, pom.xml).
fitsense.ai.enabled=${FITSENSE_AI_ENABLED:true}
fitsense.ai.api-token=${REPLICATE_API_TOKEN:}

# G5M (23/11/2026, docs/FitSense/migracion_gpt5_mini): openai/gpt-5-mini DIRECTO. gpt-5-structured responde E002 para
# esta cuenta desde el 17/11/2026 (tambien con una peticion trivial). Formato direct: system_prompt con el esquema,
# prompt, reasoning_effort, verbosity y max_completion_tokens; sin model ni json_schema. La salida se valida igual.
# REVERTIR (solo a proposito, para comparar): FITSENSE_AI_BASE_URL=.../openai/gpt-5-structured/predictions,
# FITSENSE_AI_API_FORMAT=structured y FITSENSE_AI_REASONING_EFFORT=medium.
fitsense.ai.base-url=${FITSENSE_AI_BASE_URL:https://api.replicate.com/v1/models/openai/gpt-5-mini/predictions}
# direct | structured; vacio = se deduce de base-url.
fitsense.ai.api-format=${FITSENSE_AI_API_FORMAT:}
# En direct es solo la etiqueta de respaldo: el modelo lo fija base-url. En structured viaja en la peticion.
fitsense.ai.model=${FITSENSE_AI_MODEL:gpt-5-mini}
# medium por resultados medidos (docs/FitSense/migracion_gpt5_mini/04): con low, 5/19 propuestas validas a la primera y
# 6/19 planes por respaldo (V24 recorta dosis); con medium, 11/19 y 1/19, como gpt-5-structured (12-13/19, 0). low
# tarda menos de la mitad (29 s frente a 81 s por llamada): FITSENSE_AI_REASONING_EFFORT=low para comparar.
fitsense.ai.reasoning-effort=${FITSENSE_AI_REASONING_EFFORT:medium}
fitsense.ai.verbosity=${FITSENSE_AI_VERBOSITY:low}
# Tope de salida de gpt-5-mini, razonamiento incluido. Una respuesta cortada no se acepta: es un intento rechazado.
fitsense.ai.max-completion-tokens=${FITSENSE_AI_MAX_COMPLETION_TOKENS:16000}
# Tarifa para estimar el coste en REPLICATE_CONSUMO (USD por millon de tokens). No limita nada.
fitsense.ai.cost.input-usd-per-million=${FITSENSE_AI_COST_INPUT_USD_PER_MILLION:0.25}
fitsense.ai.cost.output-usd-per-million=${FITSENSE_AI_COST_OUTPUT_USD_PER_MILLION:2.00}
fitsense.ai.timeout-seconds=150
# Espera del POST a Replicate (Prefer: wait, maximo 60). Bajarla solo si un proxy corta antes.
fitsense.ai.prefer-wait-seconds=${FITSENSE_AI_PREFER_WAIT_SECONDS:60}
# R-3 (resiliencia de Replicate): limites HTTP explicitos. Conectar (1-60 s); leer la respuesta del POST (como
# minimo Prefer: wait + 2 s; por omision Prefer: wait + 30 = 90 s); leer cada GET de sondeo o de cancelacion (2-120 s).
# El sondeo entero lo limita fitsense.ai.timeout-seconds (150 s).
fitsense.ai.connect-timeout-seconds=${FITSENSE_AI_CONNECT_TIMEOUT_SECONDS:10}
fitsense.ai.read-timeout-seconds=${FITSENSE_AI_READ_TIMEOUT_SECONDS:90}
fitsense.ai.poll-read-timeout-seconds=${FITSENSE_AI_POLL_READ_TIMEOUT_SECONDS:30}
# Rendimiento (12/11/2026, docs/FitSense/rendimiento_generacion): pausa entre consultas del sondeo (antes 3 s fijos).
fitsense.ai.poll-interval-millis=${FITSENSE_AI_POLL_INTERVAL_MILLIS:1000}
# Presupuesto total de la fase de IA de una generacion (intentos incluidos; despues decide el motor de reglas) y lo
# minimo que debe quedar para empezar un intento. 0 = DESACTIVADO (por omision, auditoria de la PR #54): 360 s habria
# cambiado 2 planes de IA de la campana de estres por el respaldo; 480 s no cambio ninguno de los 48 observados.
fitsense.ai.generate.total-budget-seconds=${FITSENSE_AI_GENERATE_TOTAL_BUDGET_SECONDS:0}
fitsense.ai.generate.min-attempt-seconds=${FITSENSE_AI_GENERATE_MIN_ATTEMPT_SECONDS:40}
# No pedir a la IA lo que se demuestra imposible con V4 + V5 + V23 + V24 + V25 (H-G9). Interruptor de emergencia.
fitsense.ai.generate.feasibility-precheck=${FITSENSE_AI_GENERATE_FEASIBILITY_PRECHECK:true}
# H1 (aprobada 03/11/2026): conservacion del patron en las sustituciones de V8C. multiconjunto = cada anadido
# reemplaza a un retirado distinto del mismo patron (por defecto). conjunto = regla historica, solo para
# compatibilidad o reversion: FITSENSE_V8C_PATTERN_RULE=conjunto.
fitsense.adaptation.v8c.pattern-rule=${FITSENSE_V8C_PATTERN_RULE:multiconjunto}
# Limite de dificultad en las sustituciones por TOO_DIFFICULT y dolor (activo en todas las campanas evaluadas con
# Replicate real: GRA, CONF-IA y pr-1.8a). Desactivar: FITSENSE_DIFFICULTY_GUARD=off.
# incluido el respaldo SUST-SEG-1. on = un sustituto no puede tener dificultad registrada mayor que la del original;
# preferencia = on y, en SUST-SEG-1, preferir la dificultad mas cercana sin superarla (igual antes que menor).
fitsense.adaptation.difficulty-guard=${FITSENSE_DIFFICULTY_GUARD:preferencia}
# Retirada localizada ante dolor (activa en todas las campanas evaluadas). Desactivar:
# FITSENSE_PAIN_LOCALIZED_REMOVAL=off. on = si lo excluido por dolor no tiene
# sustituto SUST-SEG-1 compatible, se intenta retirar SOLO ese ejercicio de su sesion senalada y conservar el resto;
# se publica unicamente si pasa V8C y la validacion estricta (V20, V24/4D...). Si no, NO_FACTIBLE y P-03 como siempre.
# Solo actua con el limite encendido (difficulty-guard=on o preferencia); con el limite en off se ignora.
fitsense.adaptation.pain-localized-removal=${FITSENSE_PAIN_LOCALIZED_REMOVAL:on}
# Prompt de adaptacion: v2.1 = FIX-PR-2.1-EXP, la version evaluada con Replicate real (por defecto). v1 = FIX-PR-1.3
# (historica) y v2 siguen disponibles para revertir. No cambia ninguna regla ni validador.
fitsense.ai.adaptation.prompt-version=${FITSENSE_AI_ADAPTATION_PROMPT_VERSION:v2.1}
# R-5 (resiliencia de Replicate): generaciones iniciales por persona y hora (1-100) que llegan a generar (cada una puede
# hacer hasta 3 predicciones). En memoria y por instancia; la exclusion de generaciones simultaneas es comun a todas.
fitsense.ai.generate.max-per-hour=${FITSENSE_AI_GENERATE_MAX_PER_HOUR:5}

# Politica de planificacion de los planes NUEVOS (PlanningPolicySelector). PLAN-REV-2.0 es la evaluada con Replicate
# real; es candidata en el catalogo, asi que exige allow-candidates=true. Los planes ya guardados conservan su
# politica por linaje. Revertir: FITSENSE_PLANNING_POLICY=PLAN-HIST-1.
fitsense.planning.policy=${FITSENSE_PLANNING_POLICY:PLAN-REV-2.0}
fitsense.planning.policy.allow-candidates=${FITSENSE_PLANNING_POLICY_ALLOW_CANDIDATES:true}

fitsense.volume.duration-to-reps-divisor=30
# --- Step 4C: cobertura de los cuatro slots obligatorios -------------------
# La implementacion entra siempre; estas dos propiedades deciden si bloquea.
# Valores: OFF | OBSERVE | ENFORCE_WHEN_SATISFIABLE | ENFORCE_ALWAYS
#
# pregeneration: que hacer en prepare() cuando algun slot se queda sin ningun
# ejercicio elegible (4C §6 NO FACTIBLE). OBSERVE lo registra y sigue; los
# modos ENFORCE_* devuelven 422 y no llaman al generador. Arranca en OBSERVE a
# proposito: convertir un flujo que hoy funciona en un 422 es decision del
# estudio, no efecto de haber escrito la cuenta.
fitsense.coverage.pregeneration=${FITSENSE_COVERAGE_PREGENERATION:OBSERVE}
#
# enforcement: que hacer en PlanDraftValidator cuando la semana propuesta se
# salta un slot que SI tenia ejercicios elegibles.
#   ENFORCE_AI_ONLY rechaza el borrador de la IA -que tiene tres
#     intentos y recibe el motivo- y NO el del motor de reglas, que no tiene
#     reintento. Medido: con el conjunto elegible real del perfil HOME del plan
#     3, el motor de reglas cubre los cuatro slots en 30 de 90 semanas (33,3 %),
#     asi que rechazarlo tambien deja sin plan a dos de cada tres participantes
#     cada vez que Replicate falle.
#   ENFORCE_WHEN_SATISFIABLE rechaza los dos cuando cumplirlo era posible. Es lo
#     que pide 4C §5 sin matices; activarlo despues de que el selector de reglas
#     sepa de patrones de movimiento.
#   ENFORCE_ALWAYS rechaza aunque la semana no tenga posiciones para todos los
#     slots. No usar sin medir antes en OBSERVE.
# Se entrega en OBSERVE: mide y registra, no rechaza. El primer paso cuando
# haya una ronda medida es ENFORCE_AI_ONLY.
fitsense.coverage.enforcement=${FITSENSE_COVERAGE_ENFORCEMENT:ENFORCE_AI_ONLY}
# --- Step 4D: dosis y tiempo de GAIN_MUSCLE -------------------------------
# Solo actua con goalType=GAIN_MUSCLE. Valores: OFF | OBSERVE | ENFORCE
# Comprueba tres cosas, simetricas para IA y motor de reglas: dosis por
# capacidad (estructural 3x10 con 90 s, relleno 2 series), maximo 6
# colocaciones por dia y presupuesto del dia por 4D v2 §5 (45 x 0,85 = 38,25
# minutos utiles). NO comprueba el reparto del 25 % de fuerza secundaria -4D
# v2 §6 da la fraccion y no su denominador-, ni el RIR -no hay columna-, ni
# duplica el coste de los ejercicios por lado, asi que el presupuesto queda
# optimista.
# NO activar ENFORCE hasta adaptar RuleBasedTrainingPlanGenerator: un borrador
# de reglas rechazado termina en PlanGenerationFailedException, o sea semana
# sin plan y adherencia NULL, y con Replicate caido le pasa a todo el mundo.
fitsense.dose.enforcement=${FITSENSE_DOSE_ENFORCEMENT:ENFORCE}
# 4A v6 + 4D v4: dosis por capacidad (V24 extendida) y principales factibles
# presentes (V25) en INCREASE_STRENGTH, LOSE_WEIGHT y GENERAL_FITNESS, para la IA
# y el motor de reglas. La adaptacion P2-D construye su validador sin esto.
fitsense.capability.enforcement=${FITSENSE_CAPABILITY_ENFORCEMENT:ENFORCE}
# --- Aprobaciones humanas de dificultad (V27/V28) --------------------------
# APAGADO. v_exercises_manually_approved tiene 4 filas, las cuatro de
# LOWER_HIP: encenderlo hoy deja el conjunto elegible en cuatro ejercicios del
# mismo patron y ningun plan pasa las validaciones. Se enciende cuando haya
# aprobaciones para los cuatro slots de 4C, no cuando el total sea alto.
fitsense.approvals.filter-enabled=${FITSENSE_APPROVALS_FILTER_ENABLED:false}

# V34 · progresion y reincorporacion condicional (DISENO_PROGRESION_Y_REINCORPORACION y
# POLITICA_ADAPTACION_Y_PROGRESION). Encendida (aprobada el 11/11/2026), con sus reglas sin cambios. Encendida
# tambien activa la V24 por capacidades en la adaptacion (StrictValidationAdapter). Requiere la V34 aplicada.
# Desactivar: FITSENSE_PROGRESSION_ENABLED=false (con false el ciclo conserva como siempre).
fitsense.adaptation.progression.enabled=${FITSENSE_PROGRESSION_ENABLED:true}
# D-P11 · V24 por capacidades tambien en la adaptacion (P2-D), junto con las
# reducciones autorizadas. Apagada: la adaptacion valida como hasta ahora.
fitsense.adaptation.capability-validation.enabled=${FITSENSE_ADAPTATION_CAPABILITY_VALIDATION:false}

# P-03 nivel 2 por colocacion (ComparacionDosisPorColocacion): ninguna colocacion de una semana regenerada ante dolor
# recupera una dosis reducida sin autorizacion, aunque el total no suba. Aprobada para la candidata y sus pruebas
# (src/test/resources/config/application.properties la enciende); en produccion, apagada hasta autorizacion expresa.
fitsense.regeneracion.p03-por-colocacion=${FITSENSE_P03_POR_COLOCACION:false}
# Generacion inicial asincrona (V58 + V59). Politica de tiempos: docs/FitSense/generacion_asincrona/VALIDACION_TIMEOUTS.md
# - heartbeat-ms / lease-seconds: liveness del worker. El latido corre en un hilo propio; solo un lease vencido
#   (proceso muerto) reencola la operacion. Al menos dos latidos por lease (se comprueba al arrancar).
# - max-processing-seconds: tiempo maximo de la OPERACION desde su primera ejecucion. Nunca menor que el peor caso del
#   pipeline con IA (3 intentos x ~331 s + 120 s = ~1.113 s): con la IA encendida, un valor menor no arranca.
# - max-executions: ejecuciones por operacion (la reanudacion no repite predicciones: libro V59).
# - recover-ms: cada cuanto barre cada instancia (huerfanas y vencidas); el reclamo sigue cada poll-ms.
fitsense.plan-generation.heartbeat-ms=${FITSENSE_PLAN_GENERATION_HEARTBEAT_MS:20000}
fitsense.plan-generation.lease-seconds=${FITSENSE_PLAN_GENERATION_LEASE_SECONDS:90}
fitsense.plan-generation.max-processing-seconds=${FITSENSE_PLAN_GENERATION_MAX_PROCESSING_SECONDS:1800}
fitsense.plan-generation.max-queued-seconds=${FITSENSE_PLAN_GENERATION_MAX_QUEUED_SECONDS:1800}
fitsense.plan-generation.max-executions=${FITSENSE_PLAN_GENERATION_MAX_EXECUTIONS:3}
fitsense.plan-generation.reuse-window-hours=${FITSENSE_PLAN_GENERATION_REUSE_WINDOW_HOURS:24}
fitsense.plan-generation.recover-ms=${FITSENSE_PLAN_GENERATION_RECOVER_MS:30000}

# --- Despliegue (PREPARACION_HTTPS_RAILWAY.md) ---------------------------------
# Detras del proxy de Railway: X-Forwarded-Proto/For de un proxy de confianza (rangos privados por omision de
# Tomcat) dan el esquema y la IP reales. Sin esto, request.isSecure() es falso y la IP es la del proxy.
server.forward-headers-strategy=${FITSENSE_FORWARD_HEADERS_STRATEGY:native}
# Rechazar HTTP en claro (403). Apagado aqui; el perfil prod lo enciende.
fitsense.security.require-https=${FITSENSE_REQUIRE_HTTPS:false}
# Actuator: solo health, sin detalles (no revela base, version ni configuracion).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# El SMTP saliente esta bloqueado en Railway Hobby: un indicador de correo pondria el servicio en DOWN.
management.health.mail.enabled=false

# --- Notificaciones push: Firebase Cloud Messaging (docs/FitSense/notificaciones_push/) -----------------
# Apagadas por omision. Las credenciales de la cuenta de servicio SOLO como secreto del entorno, nunca en el repositorio:
# FITSENSE_FIREBASE_CREDENTIALS_BASE64 (JSON en Base64), FITSENSE_FIREBASE_CREDENTIALS_FILE (ruta fuera del repositorio)
# o GOOGLE_APPLICATION_CREDENTIALS. Destino de los mensajes: Firebase Installation ID (FID), nunca tokens FCM.
fitsense.push.enabled=${FITSENSE_PUSH_ENABLED:false}
fitsense.push.firebase.project-id=${FITSENSE_FIREBASE_PROJECT_ID:kora-fitpe}
fitsense.push.android.package=${FITSENSE_PUSH_ANDROID_PACKAGE:pe.fit.kora}
fitsense.push.credentials-base64=${FITSENSE_FIREBASE_CREDENTIALS_BASE64:}
fitsense.push.credentials-file=${FITSENSE_FIREBASE_CREDENTIALS_FILE:}
# Un evento no enviado en este tiempo caduca (tambien es el TTL de Android).
fitsense.push.ttl-hours=${FITSENSE_PUSH_TTL_HOURS:24}
# Ventana hacia atras del detector: al activar la funcion no se notifica el historial.
fitsense.push.detection-window-hours=${FITSENSE_PUSH_DETECTION_WINDOW_HOURS:6}
fitsense.push.max-attempts=${FITSENSE_PUSH_MAX_ATTEMPTS:5}
fitsense.push.max-devices-per-user=${FITSENSE_PUSH_MAX_DEVICES_PER_USER:5}
# H2-v2 (PR-2.0, docs/FitSense/h2_v2/): version del texto de reglas de la GENERACION INICIAL. PR-1.7 (por omision) es la
# configuracion evaluada, identica byte a byte a la de siempre. PR-2.0 comunica a la IA el reparto que verifican V15 y
# V26 (tabla de la mitad, grupos con material, complementos y techos de series) y corrige las frases que contradicen a
# PLAN-REV-2.0 (llenar tiempo, +15 %). Activarla cambia lo que recibe la IA: requiere la evaluacion pareada con la IA
# real (presupuesto aparte) y autorizacion. La adaptacion no lee esta propiedad.
fitsense.ai.generacion.prompt-version=${FITSENSE_AI_GENERACION_PROMPT_VERSION:PR-1.7}
