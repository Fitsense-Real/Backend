spring.application.name=Fitsense

spring.datasource.url=jdbc:postgresql://ep-dark-brook-b4emftmn-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.placeholder-replacement=false

authorization.jwt.secret=${JWT_SECRET}
authorization.jwt.expiration.days=7

fitsense.ai.enabled=${FITSENSE_AI_ENABLED:false}
fitsense.ai.api-token=${REPLICATE_API_TOKEN:}

fitsense.ai.base-url=https://api.replicate.com/v1/models/openai/gpt-5-structured/predictions
fitsense.ai.model=${FITSENSE_AI_MODEL:gpt-5-mini}
fitsense.ai.reasoning-effort=${FITSENSE_AI_REASONING_EFFORT:medium}
fitsense.ai.timeout-seconds=150

fitsense.volume.duration-to-reps-divisor=30
# --- Step 4C: cobertura de los cuatro slots obligatorios -------------------
# La implementacion entra siempre; estas dos propiedades deciden si bloquea.
# Valores: OFF | OBSERVE | ENFORCE_WHEN_SATISFIABLE | ENFORCE_ALWAYS
#
# pregeneration: que hacer en prepare() cuando algun slot se queda sin ningun
# ejercicio elegible (4C §6 NO FACTIBLE). OBSERVE lo registra y sigue; los
# modos ENFORCE_* devuelven 422 y no llaman al generador. Arranca en OBSERVE a
# proposito: convertir un flujo que hoy funciona en un 422 es decision del
# estudio, no efecto de haber escrito la cuenta.
fitsense.coverage.pregeneration=${FITSENSE_COVERAGE_PREGENERATION:OBSERVE}
#
# enforcement: que hacer en PlanDraftValidator cuando la semana propuesta se
# salta un slot que SI tenia ejercicios elegibles.
#   ENFORCE_AI_ONLY rechaza el borrador de la IA -que tiene tres
#     intentos y recibe el motivo- y NO el del motor de reglas, que no tiene
#     reintento. Medido: con el conjunto elegible real del perfil HOME del plan
#     3, el motor de reglas cubre los cuatro slots en 30 de 90 semanas (33,3 %),
#     asi que rechazarlo tambien deja sin plan a dos de cada tres participantes
#     cada vez que Replicate falle.
#   ENFORCE_WHEN_SATISFIABLE rechaza los dos cuando cumplirlo era posible. Es lo
#     que pide 4C §5 sin matices; activarlo despues de que el selector de reglas
#     sepa de patrones de movimiento.
#   ENFORCE_ALWAYS rechaza aunque la semana no tenga posiciones para todos los
#     slots. No usar sin medir antes en OBSERVE.
# Se entrega en OBSERVE: mide y registra, no rechaza. El primer paso cuando
# haya una ronda medida es ENFORCE_AI_ONLY.
fitsense.coverage.enforcement=${FITSENSE_COVERAGE_ENFORCEMENT:ENFORCE_AI_ONLY}
# --- Step 4D: dosis y tiempo de GAIN_MUSCLE -------------------------------
# Solo actua con goalType=GAIN_MUSCLE. Valores: OFF | OBSERVE | ENFORCE
# Comprueba tres cosas, simetricas para IA y motor de reglas: dosis por
# capacidad (estructural 3x10 con 90 s, relleno 2 series), maximo 6
# colocaciones por dia y presupuesto del dia por 4D v2 §5 (45 x 0,85 = 38,25
# minutos utiles). NO comprueba el reparto del 25 % de fuerza secundaria -4D
# v2 §6 da la fraccion y no su denominador-, ni el RIR -no hay columna-, ni
# duplica el coste de los ejercicios por lado, asi que el presupuesto queda
# optimista.
# NO activar ENFORCE hasta adaptar RuleBasedTrainingPlanGenerator: un borrador
# de reglas rechazado termina en PlanGenerationFailedException, o sea semana
# sin plan y adherencia NULL, y con Replicate caido le pasa a todo el mundo.
fitsense.dose.enforcement=${FITSENSE_DOSE_ENFORCEMENT:ENFORCE}
# 4A v6 + 4D v4: dosis por capacidad (V24 extendida) y principales factibles
# presentes (V25) en INCREASE_STRENGTH, LOSE_WEIGHT y GENERAL_FITNESS, para la IA
# y el motor de reglas. La adaptacion P2-D construye su validador sin esto.
fitsense.capability.enforcement=${FITSENSE_CAPABILITY_ENFORCEMENT:ENFORCE}
# --- Aprobaciones humanas de dificultad (V27/V28) --------------------------
# APAGADO. v_exercises_manually_approved tiene 4 filas, las cuatro de
# LOWER_HIP: encenderlo hoy deja el conjunto elegible en cuatro ejercicios del
# mismo patron y ningun plan pasa las validaciones. Se enciende cuando haya
# aprobaciones para los cuatro slots de 4C, no cuando el total sea alto.
fitsense.approvals.filter-enabled=${FITSENSE_APPROVALS_FILTER_ENABLED:false}
