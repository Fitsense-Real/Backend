# Perfil de publicacion (SPRING_PROFILES_ACTIVE=prod). PREPARACION_HTTPS_RAILWAY.md.
# Sin valores por omision para la base: si falta una variable, la aplicacion no arranca (mejor que conectar a una
# base equivocada). Ningun secreto en este fichero: todos llegan por variables de entorno de Railway.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# HTTPS obligatorio para la API (403 en HTTP); el health check interno queda exento.
fitsense.security.require-https=${FITSENSE_REQUIRE_HTTPS:true}
server.forward-headers-strategy=native

# Sin documentacion publica de la API ni ejecucion manual del ciclo.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
fitsense.api-docs.enabled=false
fitsense.cycle.manual-run.enabled=false

# Errores sin detalles internos.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
