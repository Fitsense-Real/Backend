# Configuracion de la CANDIDATA para todas las pruebas de Spring (cierre premerge, 15/11/2026). Spring Boot carga este
# archivo ADEMAS de src/main/resources/application.properties, con prioridad sobre el. No va en el jar: no afecta a
# produccion. Un @SpringBootTest(properties = ...) lo sigue pudiendo cambiar.
#
# P-03 por colocacion: el propietario autorizo habilitarla en la candidata final, solo para pruebas y preparacion de
# la integracion (no en produccion).
fitsense.regeneracion.p03-por-colocacion=true

# P0-02: los contextos de prueba se comparten entre clases y registran e inician sesion cientos de veces desde la
# misma IP (127.0.0.1). Aqui los cupos son altos; LimitesDeAutenticacionIT fija los suyos, bajos, para probarlos.
fitsense.auth-rate-limit.login-per-ip=1000000
fitsense.auth-rate-limit.register-per-ip=1000000
fitsense.auth-rate-limit.login-failures-per-account=1000000
fitsense.consent.accept-per-ip=1000000
